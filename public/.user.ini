; PHP limits for hosts that read .user.ini (PHP-FPM, LiteSpeed, most cPanel
; servers). Core release ZIPs can be large; changes apply within 5 minutes.
; Where the host ignores this file, set the same values in its PHP settings.
upload_max_filesize = 256M
post_max_size = 260M
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
